# enable-release-workflow (JOS-206), ADR 0007 — a version tag on main releases: vX.Y.Z publishes a release on the production
# channel, vX.Y.Z-rc.N a pre-release on the uat channel, each after a reviewer approves the `release` environment.
# `workflow_dispatch` is a dry run: it builds and uploads workflow artifacts and never publishes.
name: Release

on:
  push:
    tags: ["v*"] # release.sh parse rejects anything that is not vX.Y.Z or vX.Y.Z-rc.N
  workflow_dispatch:

env:
  RELEASE_BRANCH: main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      channel: ${{ steps.decide.outputs.channel }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # on-branch needs the release branch's history
      - id: decide
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            .github/scripts/release.sh parse "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            .github/scripts/release.sh on-branch "$GITHUB_REF_NAME" "origin/$RELEASE_BRANCH"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=\nversion=0.0.0-dry-run\nchannel=development\nprerelease=false\n' >> "$GITHUB_OUTPUT"
          fi
          echo "$GITHUB_REF_NAME: $(grep -E "^(version|channel)=" "$GITHUB_OUTPUT" | tr "\n" " ")" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: decide
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: [checks, decide]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: win32-x64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    # sign-executables (JOS-207) Decision 2 — the signing secrets exist only on a pushed version tag; a dry run attaches no environment and skips signing.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && 'signing' || '' }}
    permissions:
      contents: read
    env:
      SIGNING_REQUIRED: ${{ vars.SIGNING_REQUIRED }}
      VID4YOU_CHANNEL: ${{ needs.decide.outputs.channel }}
      VID4YOU_VERSION: ${{ needs.decide.outputs.version }}
      VID4YOU_RELEASE_TAG: ${{ needs.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.4.0 # backend/packaging/targets.ts NODE_VERSION: the single-executable blob needs this exact Node
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: backend
      - run: npm run package:${{ matrix.target }}
        working-directory: backend
      - name: Decide signing
        id: signing
        shell: bash
        env: # ponytail: Windows secret names are fixed with the provider (task 3.4); until then a Windows build is always unsigned
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [[ "${{ matrix.target }}" == darwin-* ]]; then names=(MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8)
          else names=(WINDOWS_SIGNING_CREDENTIAL); fi
          echo "result=$(.github/scripts/signing.sh decide "$SIGNING_REQUIRED" "${names[@]}")" >> "$GITHUB_OUTPUT"
      - name: Sign macOS
        if: steps.signing.outputs.result == 'sign' && startsWith(matrix.target, 'darwin-')
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: .github/scripts/sign-macos.sh sign backend/dist-package/${{ matrix.target }}
      - name: Notarize macOS
        if: steps.signing.outputs.result == 'sign' && startsWith(matrix.target, 'darwin-')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: .github/scripts/sign-macos.sh notarize backend/dist-package/${{ matrix.target }}
      - name: Delete temporary keychain
        if: always() && startsWith(matrix.target, 'darwin-')
        run: .github/scripts/sign-macos.sh cleanup
      - name: Sign Windows
        if: steps.signing.outputs.result == 'sign' && matrix.target == 'win32-x64'
        shell: pwsh
        run: .github/scripts/sign-windows.ps1 (Get-ChildItem backend/dist-package/${{ matrix.target }}/*.exe).FullName # the provider's secrets are added to this step in task 3.4
      - name: Verify Windows signature
        if: steps.signing.outputs.result == 'sign' && matrix.target == 'win32-x64'
        shell: pwsh
        run: .github/scripts/verify-windows.ps1 (Get-ChildItem backend/dist-package/${{ matrix.target }}/*.exe).FullName
      - name: Zip
        shell: pwsh
        working-directory: backend
        env:
          ARCHIVE: Vid4You-${{ matrix.target }}${{ steps.signing.outputs.result == 'sign' && '' || '-unsigned' }}
        run: |
          Move-Item dist-package/${{ matrix.target }} $env:ARCHIVE
          if ($IsWindows) { Compress-Archive $env:ARCHIVE "$env:ARCHIVE.zip" }
          else { ditto -c -k --keepParent $env:ARCHIVE "$env:ARCHIVE.zip" } # keeps the executable bit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Vid4You-${{ matrix.target }}
          path: backend/Vid4You-${{ matrix.target }}*.zip
          if-no-files-found: error

  publish:
    needs: [decide, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release # required reviewer, configured in repository settings
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - run: .github/scripts/release.sh checksums assets
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          PRERELEASE: ${{ needs.decide.outputs.prerelease == 'true' && '--prerelease' || '' }}
        run: |
          gh release create "$TAG" assets/*.zip assets/SHA256SUMS.txt $PRERELEASE \
            --verify-tag --title "Vid4You $TAG" \
            --notes "Built from commit $GITHUB_SHA. $(.github/scripts/signing.sh notes assets) Verify the files with SHA256SUMS.txt. The archives carry a GPL nonfree ffmpeg build that is not redistributable: for the owner's use only."

  verify:
    needs: [decide, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: gh release download "$TAG" --dir downloaded
      - run: .github/scripts/release.sh verify downloaded
